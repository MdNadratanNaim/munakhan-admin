name: Deploy admin panel to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    # Developer switch: a push whose latest commit message contains [skip ci]
    # (or [ci skip], [no ci], [skip actions], [actions skip]) does not deploy,
    # so Cloudflare keeps serving the previous version of the admin panel.
    # GitHub already skips push runs for these markers; the check is repeated
    # here so the behaviour is explicit and stays true if the triggers change.
    # Running the workflow by hand (workflow_dispatch) always deploys.
    if: >-
      github.event_name != 'push' || !(
        contains(github.event.head_commit.message, '[skip ci]') ||
        contains(github.event.head_commit.message, '[ci skip]') ||
        contains(github.event.head_commit.message, '[no ci]') ||
        contains(github.event.head_commit.message, '[skip actions]') ||
        contains(github.event.head_commit.message, '[actions skip]')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build for Cloudflare
        run: pnpm cf:build

      # The Worker's own runtime secrets (GITHUB_TOKEN, WEBSITE_REPO,
      # DATABASE_REPO) live in Cloudflare, set once via
      # `wrangler secret put GITHUB_TOKEN` (or the dashboard) and
      # wrangler.toml's [vars] — NOT here. This job only needs Cloudflare
      # API credentials to push the build.

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy